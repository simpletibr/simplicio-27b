  hellaswag:
    hf_id: Rowan/hellaswag
    revision: 218ec52e09a7e7462a5400043bb9a69a41d06b76
    license: mit
    decision: deny
    evidence: "API do HF 2026-10-21, sha 218ec52e: sem licenca no metadado do card (o README diz MIT), mas os contextos vem do WikiHow (CC BY-NC-SA) e do ActivityNet"
    adapter: none
    notes: "SCHEMA 8: fonte com conteudo NC/ND vai para a lista negra, sem excecao; a licenca MIT do dataset nao cobre o conteudo de origem. Fica em deny ate haver parecer juridico por escrito"
  tasksource_bigbench:
