# decide/config.data.yaml :: configuracao de dados (Squad B). Sobreposta a decide/config.yaml por sd.config.load_config.
# So a chave `data`. As chaves da Squad A (hub, models, merge, eval, budget, calibration, tta, fidelity, gates,
# modal, kit) nao aparecem aqui. Segredos nao ficam aqui: HF_TOKEN e a chave do gerador vem do ambiente.

data:
  seed: 20261021
  sources: decide/data/sources.yaml          # registro de fontes e politica de licencas
  corpus:
    out_dir: work/corpus
    shard_rows: 50000
    dev_percent: 1.0                         # % do corpus que vira split dev (por hash do example_id)
    include_review: false                    # fontes `review` so entram se o dono ligar isto
    caps_scale: 1.0                          # multiplica o `cap` de cada fonte (0.01 = teste de fumaca)
  decontaminate:
    ngram: 13
    max_df: 20                               # unidades em mais de 20 pedidos de referencia = boilerplate
    min_line_words: 5
    out_dir: work/corpus-clean
    references:                              # arquivos da suite publica gerados pelo kit (suite rebuild/import)
      - work/suite-0.3/selected-rows.jsonl.gz
      - work/suite-0.3/added-rows.jsonl.gz
      - work/suite-0.3/gsm8k-rows.jsonl.gz
  generator:                                 # novos dominios PT-BR/EN; DESLIGADO por padrao
    # Duas chaves: `enabled: true` aqui E `--generate` em `python -m decide.data.build_corpus`. Os termos do provedor
    # escolhido valem para o texto gerado (as linhas saem com licenca `provider-terms`).
    enabled: false
    provider: null                           # command | openai-compatible
    command: []                              # argv do provedor `command` (prompt no stdin, resposta no stdout)
    base_url: null                           # provedor openai-compatible: https:// (http so em localhost)
    model: null
    api_key_env: GENERATOR_API_KEY           # nome da variavel de ambiente; a chave nunca fica em arquivo
    per_task: 200
    tasks: []                                # [{domain, lang, qtype: choice|noul|score, description}]
  loop:
    files: [data/simplicio_loop_50pts_train.jsonl, data/v2/train.jsonl]
    per_record: 2
  proxy:
    out_dir: work/proxy
    per_source: 300
    min_models: 6                            # G1
    min_rho: 0.8                             # G1: Spearman >= 0,8 contra o Full do board
    board_index: work/space/data/index.json
